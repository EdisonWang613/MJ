name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 配置 CMake
        run: cmake -S . -B build -A x64

      - name: 编译
        run: cmake --build build --config Debug --parallel

      - name: 运行测试
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error
